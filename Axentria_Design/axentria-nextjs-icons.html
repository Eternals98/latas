
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>Axentria — Iconografía Local</title>
<style>
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fdfcf9; /* --paper-50 */
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
    color: #0f1b2d; /* --ink-900 */
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 800px;
    margin-top: 40px;
  }
  .icon-card {
    background: white;
    border: 1px solid #e2e8f0;
    padding: 20px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    transition: transform 0.2s;
  }
  .icon-card:hover { transform: translateY(-4px); border-color: #e0a24a; }
  .label { font-size: 11px; font-family: monospace; color: #64748b; }
  .header { text-align: center; max-width: 600px; }
  .brand-block { display: flex; gap: 40px; margin-bottom: 60px; padding: 30px; background: #0f1b2d; border-radius: 20px; color: #fdfcf9; align-items: center; }
</style>
</head>
<body>
  <div class="header">
    <h1 style="font-family: 'Instrument Serif', serif; font-size: 48px; margin: 0;">Iconografía Axentria</h1>
    <p style="color: #64748b; margin-top: 12px;">Sistema de iconos SVG locales integrados directamente en el código de Next.js.</p>
  </div>

  <div class="brand-block">
    <div style="text-align: center;">
      <div class="label" style="margin-bottom: 10px; color: #9ca9ba;">Componente: BrandMark</div>
      <svg width="60" height="60" viewBox="0 0 24 24" fill="none">
        <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" fill="#e0a24a" />
        <path d="M12 6l-6 3.5v5L12 18l6-3.5v-5L12 6z" fill="white" fill-opacity="0.2" />
        <path d="M12 22V12M12 12l9-5M12 12L3 7" stroke="white" stroke-width="1.5" stroke-opacity="0.3" />
      </svg>
    </div>
    <div style="text-align: center;">
      <div class="label" style="margin-bottom: 10px; color: #9ca9ba;">Componente: BrandLogo</div>
      <svg height="40" viewBox="0 0 120 24" fill="none">
        <text x="0" y="20" font-family="serif" font-size="20" font-weight="700" fill="#fdfcf9">AXENTRIA</text>
      </svg>
    </div>
  </div>

  <div class="grid" id="icon-grid">
    <!-- Generado dinámicamente para demostración visual -->
  </div>

  <script>
    const icons = [
      'plus', 'minus', 'check', 'x', 'chevronDown', 'chevronUp', 'search', 'bell', 
      'user', 'users', 'home', 'chart', 'receipt', 'cash', 'creditCard', 'bank',
      'settings', 'help', 'info', 'alert', 'calendar', 'download', 'print', 'copy'
    ];
    const grid = document.getElementById('icon-grid');
    icons.forEach(name => {
      const card = document.createElement('div');
      card.className = 'icon-card';
      card.innerHTML = `
        <div style="color: #0f1b2d"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" opacity="0.1" fill="currentColor"/><text x="12" y="15" text-anchor="middle" font-size="8" fill="currentColor" stroke="none">?</text></svg></div>
        <div class="label">${name}</div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
